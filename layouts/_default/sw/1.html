{{ define "main" }}
    <div class="video-container" onclick="formSubmit()">
        <video 
            class="video-background"
            autoplay 
            muted 
            loop 
            playsinline
            preload="metadata">
            <!-- Modern AV1 in MP4 (most efficient) -->
            <source src="/mp4/videopops-av1.mp4" type='video/mp4; codecs="av01.0.08M.08"'>
            
            <!-- VP9 in WebM (good middle ground) -->
            <source src="/mp4/videopops-vp9.webm" type='video/webm; codecs="vp9"'>
            
            <!-- H.264 fallback (universal) -->
            <source src="/mp4/videopops-h264.mp4" type='video/mp4; codecs="avc1.42E01E"'>
            
            Your browser does not support the video tag.
        </video>
    </div>

{{ range .Params.modals }}
{{ $modal := resources.Get . | js.Build  | fingerprint }}
<!-- Use this for external scripts -->
<script src="{{ $modal.RelPermalink }}"></script>
<!-- Use this for inline scripts -->
<!--<script> {{ $modal.Content | safeJS }} </script> -->
{{ end }}
    
{{ end }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AV1 Video Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        .video-background {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            object-position: center;
        }
        
        /* Fallback for older browsers */
        @supports not (object-fit: cover) {
            .video-background {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container" onclick="handleClick()">
        <video 
            class="video-background"
            autoplay 
            muted 
            loop 
            playsinline
            preload="metadata">
            <!-- Modern AV1 in MP4 (most efficient) -->
            <source src="video-av1.mp4" type='video/mp4; codecs="av01.0.08M.08"'>
            
            <!-- VP9 in WebM (good middle ground) -->
            <source src="video-vp9.webm" type='video/webm; codecs="vp9"'>
            
            <!-- H.264 fallback (universal) -->
            <source src="video-h264.mp4" type='video/mp4; codecs="avc1.42E01E"'>
            
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        function handleClick() {
            console.log('Background clicked!');
            // Add your custom logic here
        }

        // Ensure video plays (helps with mobile autoplay policies)
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('.video-background');
            // Muted autoplay should work; this is a safety net
            video.play().catch(e => {
                console.warn('Autoplay blocked (expected on some mobile):', e.message);
            });
        });
    </script>
</body>
</html>

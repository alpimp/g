<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Game - Prelander</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .hero {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
            color: white;
            padding: 2rem 1.25rem 1.5rem;
            text-align: center;
            flex-shrink: 0;
        }

        .hero h1 {
            font-size: 22px;
            font-weight: 500;
            margin: 0 0 0.25rem;
            line-height: 1.3;
        }

        .hero p {
            font-size: 13px;
            opacity: 0.9;
            margin: 0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1.25rem;
            gap: 1rem;
        }

        .genres-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }

        .genre-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 12px;
            background: white;
            border: 0.5px solid #e5e5e5;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 500;
            font-size: 14px;
            color: #333;
            min-height: 110px;
        }

        .genre-btn:active {
            transform: scale(0.95);
            background: #f8f8f8;
        }

        .genre-btn:hover {
            border-color: #ccc;
            background: #f8f8f8;
        }

        .genre-btn.selected {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
            color: white;
            border-color: transparent;
        }

        .genre-icon {
            font-size: 36px;
            display: block;
            line-height: 1;
        }

        .genre-label {
            font-size: 13px;
            text-align: center;
            line-height: 1.2;
        }

        .genre-btn.center {
            grid-column: 1 / -1;
            min-height: 100px;
        }

        .loading-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .loading-state.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #e5e5e5;
            border-top-color: #FF6B35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .loading-text strong {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .cta-section {
            padding: 1rem 1.25rem;
            flex-shrink: 0;
            border-top: 0.5px solid #e5e5e5;
            background: white;
        }

        .cta-button {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cta-button:active {
            transform: scale(0.98);
            box-shadow: 0 1px 4px rgba(255, 107, 53, 0.2);
        }

        .cta-button:hover {
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Choose your vibe</h1>
            <p>What do you feel like playing?</p>
        </div>

        <div class="content" id="mainContent">
            <div class="genres-grid" id="genresGrid">
                <button class="genre-btn" onclick="selectGenre('action', this)">
                    <span class="genre-icon">🎮</span>
                    <span class="genre-label">Action</span>
                </button>
                <button class="genre-btn" onclick="selectGenre('racing', this)">
                    <span class="genre-icon">🏎️</span>
                    <span class="genre-label">Racing</span>
                </button>
                <button class="genre-btn" onclick="selectGenre('puzzle', this)">
                    <span class="genre-icon">🧩</span>
                    <span class="genre-label">Puzzle</span>
                </button>
                <button class="genre-btn" onclick="selectGenre('sports', this)">
                    <span class="genre-icon">⚽</span>
                    <span class="genre-label">Sports</span>
                </button>
                <button class="genre-btn center" onclick="selectGenre('strategy', this)">
                    <span class="genre-icon">👑</span>
                    <span class="genre-label">Strategy</span>
                </button>
            </div>

            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div class="loading-text">
                    <strong id="selectedGenreText">Action</strong>
                    <span>Finding games for you...</span>
                </div>
            </div>
        </div>

        <div class="cta-section">
            <button class="cta-button" onclick="handleContinue()">
                Continue →
            </button>
        </div>
    </div>

    <script>
        let isLoading = false;

        function selectGenre(genre, element) {
            if (isLoading) return;
            
            isLoading = true;
            
            const genreNames = {
                'action': 'Action',
                'racing': 'Racing',
                'puzzle': 'Puzzle',
                'sports': 'Sports',
                'strategy': 'Strategy'
            };
            
            document.getElementById('selectedGenreText').textContent = genreNames[genre];
            
            document.getElementById('genresGrid').style.opacity = '0';
            document.getElementById('genresGrid').style.pointerEvents = 'none';
            
            setTimeout(() => {
                document.getElementById('mainContent').style.justifyContent = 'center';
                document.getElementById('loadingState').classList.add('active');
                
                setTimeout(() => {
                    // Track conversion or redirect
                    console.log(`User selected: ${genre}`);
                    // Replace with your tracking pixel or redirect URL
                    // window.location.href = 'YOUR_OFFER_URL?genre=' + genre;
                }, 1800);
            }, 150);
        }

        function handleContinue() {
            alert('Replace this with your tracking pixel or redirect URL');
            // window.location.href = 'YOUR_OFFER_URL';
        }

        document.addEventListener('touchstart', () => {}, { passive: true });
    </script>
</body>
</html>

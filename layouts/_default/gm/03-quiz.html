<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Quiz - Prelander</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #5E72E4 0%, #825EE4 100%);
            color: white;
            padding: 1rem 1.25rem;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .progress-label {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 500;
        }

        .progress-bar {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header h2 {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 1.25rem;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .question-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-group.hidden {
            display: none;
        }

        .option-btn {
            padding: 14px 16px;
            background: white;
            border: 0.5px solid #e5e5e5;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #333;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:active {
            transform: scale(0.98);
            background: #f8f8f8;
        }

        .option-btn:hover {
            border-color: #ccc;
            background: #f8f8f8;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #5E72E4 0%, #825EE4 100%);
            color: white;
            border-color: transparent;
        }

        .option-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .result-screen {
            display: none;
            text-align: center;
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-screen.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }

        .result-icon {
            font-size: 48px;
            display: block;
            animation: bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .result-title {
            font-size: 20px;
            font-weight: 500;
            color: #333;
            margin: 0;
        }

        .result-subtitle {
            font-size: 14px;
            color: #666;
            margin: 0;
            line-height: 1.5;
        }

        .result-games {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .game-chip {
            display: inline-block;
            background: #e6f1fb;
            color: #185FA5;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .cta-section {
            padding: 1rem 1.25rem;
            flex-shrink: 0;
            border-top: 0.5px solid #e5e5e5;
            background: white;
        }

        .cta-button {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8A50 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cta-button:active {
            transform: scale(0.98);
            box-shadow: 0 1px 4px rgba(255, 107, 53, 0.2);
        }

        .cta-button:hover {
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        }

        .cta-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <span class="progress-label" id="progressLabel">Question 1 of 2</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 50%;"></div>
                </div>
            </div>
            <h2 id="questionTitle">What do you enjoy?</h2>
        </div>

        <div class="content">
            <!-- Question 1: Genre Preference -->
            <div class="question-group" id="question1">
                <button class="option-btn" onclick="selectOption(1, 'action', this)">
                    <span class="option-icon">🎮</span>
                    <span>Action & Adventure</span>
                </button>
                <button class="option-btn" onclick="selectOption(1, 'racing', this)">
                    <span class="option-icon">🏎️</span>
                    <span>Racing & Speed</span>
                </button>
                <button class="option-btn" onclick="selectOption(1, 'puzzle', this)">
                    <span class="option-icon">🧩</span>
                    <span>Puzzle & Brain Games</span>
                </button>
                <button class="option-btn" onclick="selectOption(1, 'sports', this)">
                    <span class="option-icon">⚽</span>
                    <span>Sports & Competition</span>
                </button>
            </div>

            <!-- Question 2: Time Commitment -->
            <div class="question-group hidden" id="question2">
                <button class="option-btn" onclick="selectOption(2, 'short', this)">
                    <span class="option-icon">⏱️</span>
                    <span>5–10 minutes (quick sessions)</span>
                </button>
                <button class="option-btn" onclick="selectOption(2, 'medium', this)">
                    <span class="option-icon">⏰</span>
                    <span>15–30 minutes (casual play)</span>
                </button>
                <button class="option-btn" onclick="selectOption(2, 'long', this)">
                    <span class="option-icon">🎮</span>
                    <span>1 hour+ (deep sessions)</span>
                </button>
            </div>

            <!-- Result Screen -->
            <div class="result-screen" id="resultScreen">
                <span class="result-icon">✨</span>
                <p class="result-title">We found your games!</p>
                <p class="result-subtitle">Based on your preferences</p>
                <div class="result-games">
                    <span class="game-chip" id="chip1">Game 1</span>
                    <span class="game-chip" id="chip2">Game 2</span>
                    <span class="game-chip" id="chip3">Game 3</span>
                </div>
            </div>
        </div>

        <div class="cta-section">
            <button class="cta-button" id="ctaButton" onclick="handleCTA()" disabled>
                <span id="ctaText">Select an option to continue</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <script>
        let currentQuestion = 1;
        let selectedGenre = '';
        let selectedTime = '';

        const genreGames = {
            'action': ['Action Quest', 'Battle Heroes', 'Combat Master'],
            'racing': ['Desert Racing', 'Speed Legends', 'Track Rush'],
            'puzzle': ['Bubble Adventure', 'Brain Blocks', 'Logic Master'],
            'sports': ['Football Stars', 'Basketball Pro', 'Sports Champion']
        };

        const timeLabels = {
            'short': 'Quick Sessions',
            'medium': 'Casual Play',
            'long': 'Deep Gaming'
        };

        function selectOption(question, value, element) {
            const buttons = document.querySelectorAll(`#question${question} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            
            if (question === 1) {
                selectedGenre = value;
                document.getElementById('ctaText').textContent = 'Next question →';
            } else {
                selectedTime = value;
                document.getElementById('ctaText').textContent = 'View my games →';
            }
            
            document.getElementById('ctaButton').disabled = false;
        }

        function handleCTA() {
            if (currentQuestion === 1 && !selectedGenre) return;
            if (currentQuestion === 2 && !selectedTime) return;
            
            if (currentQuestion === 1) {
                // Move to question 2
                currentQuestion = 2;
                document.getElementById('question1').classList.add('hidden');
                document.getElementById('question2').classList.remove('hidden');
                document.getElementById('questionTitle').textContent = 'How much time do you play?';
                document.getElementById('progressLabel').textContent = 'Question 2 of 2';
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('ctaButton').disabled = true;
                document.getElementById('ctaText').textContent = 'Select an option to continue';
                
                // Reset selections
                document.querySelectorAll('#question2 .option-btn').forEach(btn => {
                    btn.classList.remove('selected');
                });
            } else {
                // Show results
                showResults();
            }
        }

        function showResults() {
            document.getElementById('question2').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('active');
            
            const games = genreGames[selectedGenre];
            document.getElementById('chip1').textContent = games[0];
            document.getElementById('chip2').textContent = games[1];
            document.getElementById('chip3').textContent = games[2];
            
            document.getElementById('ctaButton').disabled = false;
            document.getElementById('ctaText').textContent = 'View games →';
            document.getElementById('ctaButton').onclick = () => {
                console.log(`Quiz complete: Genre=${selectedGenre}, Time=${selectedTime}`);
                // Replace with your tracking pixel or redirect URL
                // window.location.href = 'YOUR_OFFER_URL?genre=' + selectedGenre + '&time=' + selectedTime;
            };
        }

        document.addEventListener('touchstart', () => {}, { passive: true });
    </script>
</body>
</html>
